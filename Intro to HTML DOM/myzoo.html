<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {

            font-family: Arial, sans-serif;

            background: aliceblue;

            text-align: center;

            padding: 30px;

        }

        h1 {

            color: #ff5a43;

        }

        #zoo {

            border: 2px solid #ff5a43;

            width: 300px;

            margin: 16px auto;

            padding: 12px;

            border-radius: 10px;

            background: white;

        }

        .zone {

            border: 1px solid #ff5a43;

            margin: 6px 0;

            padding: 8px 12px;

            border-radius: 6px;

            text-align: left;

        }

        button {

            background: #ff5a43;

            color: white;

            padding: 10px 24px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

        }
    </style>
</head>

<body>
    <h1>My Zoo</h1>
    <p>Use JavaScript and the DOM to add animals to each cage!</p>
    <div id="zoo">
        <div class="zone">
            Zone 1:
            <span id="Zone1"></span>
        </div>
        <div class="zone">
            Zone 2:
            <span id="Zone2"></span>
        </div>
        <div class="zone">
            Zone 3:
            <span id="Zone3"></span>
        </div>
        <div class="zone">
            Total Animal:
            <span id="total"></span>
        </div>
    </div>
    <button onclick="openZoo()">Open the Zoo!</button>
    <p id="status"></p>
    <script>
        function openZoo(){

            document.getElementById("Zone1").innerHTML = "Lion";
            document.getElementById("Zone2").innerHTML = "Tiger";
            document.getElementById("Zone3").innerHTML = "Elephant";
            document.getElementById("total").innerHTML = "3";
            document.getElementById("zoo").style.backgroundColor = "pink"
            document.getElementById("status").innerHTML = "The Zoo is currently open!"

        }
    </script>
</body>

</html>
