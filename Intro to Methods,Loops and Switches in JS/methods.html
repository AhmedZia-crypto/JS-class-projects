<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Methods of string operations</h1>

    <script>

        var word = "BeAuTifUl";
        document.write(word.toLowerCase())
        document.write("<br>")
        document.write(word.toUpperCase())
        document.write("<br>")
        document.write(document.length)
        document.write("<br>")
        document.write(word.charAt(1))
        document.write("<br>")
         document.write(word.startsWith("B"))

    </script>
</body>
</html>
