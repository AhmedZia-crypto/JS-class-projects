<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Addition</h1>

    <button onclick="add()">result</button>

    <p id="result"></p>

    <script>

        function add() {

            var a = 10;

            var b = 45

            var c = a + b;

            document.getElementById("result").innerHTML = c;

        }


    </script>


</body>

</html>
