<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Functions With Parameter</h1>
    <p id="para"></p>
    <script>

        function add(x, y){

            return x + y;
        }

        var sum = add(5,10);

        document.getElementById("para").innerHTML = "The sum of x and y is " +sum;
        
    </script>
</body>
</html>
